openapi: 3.1.0
info:
  title: Cue API
  version: 0.1.0
  description: |
    HTTP contract between cue-api and cue-ios. Source of truth for endpoints,
    request/response shapes, and status codes. See `docs/architecture.md` and
    `docs/specs/` for design rationale.

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.cue.app
    description: Production (placeholder — not yet deployed)

tags:
  - name: health
  - name: auth
    description: Apple Sign-In token exchange and session introspection.
  - name: assistant
    description: Telegram AI assistant — account linking status and control.
  - name: tasks
    description: Task/event CRUD. A Task is the unified event + todo primitive.
  - name: task-groups
    description: TaskGroup CRUD. A TaskGroup is a calendar-owned bucket of tasks that may carry a default recurrence config, color, and completion requirement its tasks inherit.
  - name: users
    description: Current-user profile and per-user settings (e.g. the daily notification report).

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /auth/apple:
    post:
      tags: [auth]
      summary: Exchange an Apple identity token for a Cue JWT
      description: |
        Verifies the Apple-signed identity token, provisions a new user (+ default
        calendar) on first sign-in, or merges fresh profile fields onto a returning
        user. Returns a Cue-signed JWT plus the user record. See
        `docs/specs/auth-apple-signin.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
      responses:
        '200':
          description: Sign-in succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Apple identity token invalid, expired, or audience mismatch.

  /auth/me:
    get:
      tags: [auth]
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing, invalid, or expired bearer token.
        '404':
          description: Token decodes but the user no longer exists.

  /assistant/link:
    get:
      tags: [assistant]
      summary: Current Telegram link status
      description: |
        Reports whether the signed-in user has a linked Telegram chat. Drives the
        Settings "Connect Telegram" row. See
        `docs/specs/telegram-ai-assistant.md`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current link state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLinkStatus'
        '401':
          description: Missing, invalid, or expired bearer token.
    post:
      tags: [assistant]
      summary: Redeem a linking code
      description: |
        App-initiated binding. Burns the single-use nonce the bot issued and
        upserts the `TelegramLink` binding this user to the Telegram chat, then
        returns the resulting link state (`linked: true`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTelegramRequest'
      responses:
        '200':
          description: Linking succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLinkStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '422':
          description: |
            The nonce is invalid, expired, or already burned (M3). Returns a typed
            `{ code: 'INVALID_LINK_CODE', message }` body so iOS can branch a
            persistent bad-code state vs a transient error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidLinkCodeBody'
    delete:
      tags: [assistant]
      summary: Revoke the Telegram link
      description: |
        Disconnects the signed-in user's Telegram chat. Idempotent — succeeds
        with `linked: false` whether or not a link was present.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Link revoked (or already absent).
          content:
            application/json:
              schema:
                type: object
                required: [linked]
                properties:
                  linked:
                    type: boolean
                    enum: [false]
        '401':
          description: Missing, invalid, or expired bearer token.

  /assistant/parse:
    post:
      tags: [assistant]
      summary: Parse natural language into a task draft
      description: |
        Parses one line of natural language into a structured task draft (D4) via
        the assistant AI connector WITHOUT creating a task. JWT-guarded. The iOS
        quick-create well pre-fills its fields from the returned `TaskDraftDTO`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseTaskRequest'
      responses:
        '200':
          description: The extracted task draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDraftDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.

  /tasks:
    get:
      tags: [tasks]
      summary: List task occurrences in a calendar and date range
      description: |
        Returns the expanded occurrences of all tasks in `calendarId` that
        intersect the half-open window `[from, to)`. Each recurring anchor is
        expanded into one `OccurrenceDTO` per occurrence date; one-off tasks
        produce one `OccurrenceDTO` each. Exceptions (skips, overrides) are
        applied. Occurrence identity for per-instance actions is `(taskId, occurrenceStart)`.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Calendar to read. Must belong to the authenticated user.
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound of the occurrence window (ISO-8601).
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Exclusive upper bound of the occurrence window (ISO-8601).
        - name: includeCompleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, completed occurrences are included.
        - name: includeTodos
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, timeless todos (no startAt) are included.
      responses:
        '200':
          description: Expanded occurrences for the window.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccurrenceDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: The calendar is owned by another user.
        '404':
          description: The calendar does not exist.
    post:
      tags: [tasks]
      summary: Create a task
      description: |
        Creates a task in the referenced calendar (which must belong to the
        authenticated user) and returns the persisted series row as a `TaskDTO`
        with the embedded recurrence config. Supports timed events, all-day events,
        timeless todos, recurring series (via `recurrence`), and group assignment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: The calendar is owned by another user.
        '404':
          description: The calendar does not exist.

  /tasks/search:
    get:
      tags: [tasks]
      summary: Search tasks by text
      description: |
        Case-insensitive ILIKE search over `title` + `notes` across ALL the authed
        user's calendars (M1 — NOT window-bound). `q` is required and trimmed; an
        optional `groupId` narrows to one group; `limit` defaults to 25 and is
        clamped to 50. Returns the matched series rows (recurring matches return the
        anchor) as `TaskSearchResultDTO[]`.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Case-insensitive search term matched against title + notes (trimmed).
        - name: groupId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Narrow the search to a single task group.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
          description: Maximum matches to return (clamped to 50).
      responses:
        '200':
          description: Matching tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskSearchResultDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.

  /tasks/daily-counts:
    get:
      tags: [tasks]
      summary: Per-day task occurrence counts in a calendar and date range
      description: |
        Returns the number of task occurrences bucketed onto each local date
        (`YYYY-MM-DD`, in each task's timezone) within the half-open window
        `[from, to)` for `calendarId`. Occurrence-aware: each recurring anchor is
        expanded (exceptions applied) and every resulting occurrence contributes
        to its date bucket — a weekly task with 4 occurrences in range adds 4
        across the respective days. Counts on the same local date are summed and
        zero-count days are omitted from the response.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Calendar to count for. Must belong to the authenticated user.
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound of the window (ISO-8601).
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Exclusive upper bound of the window (ISO-8601).
        - name: includeCompleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, completed occurrences are counted.
      responses:
        '200':
          description: Per-day occurrence counts for the window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyCountsDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: The calendar is owned by another user.
        '404':
          description: The calendar does not exist.

  /tasks/changes:
    get:
      tags: [tasks]
      summary: Precise change-delta for a calendar since an opaque cursor
      description: |
        Returns everything that changed in `calendarId` since the opaque cursor
        `since` (the `serverTime` of the previous response, echoed verbatim):

        - `tasks` — changed series rows (`updatedAt > since`), each with the
          embedded `recurrence` config.
        - `deleted` — ids of series soft-deleted (`deletedAt > since`); visible
          via `withDeleted`.
        - `exceptions` — per-occurrence overrides changed since the cursor.
          Exceptions are hard-deleted (no tombstone), so a *removed* exception is
          surfaced indirectly by the parent Task's `updatedAt` bump (the write
          path touches the parent).
        - `serverTime` — the new opaque cursor (server clock, not the client's),
          captured BEFORE the reads so no change is missed between read and stamp.

        On the FIRST call, omit `since`: the response carries empty sets and only
        the cursor for the client to store, and the client falls back to a full
        per-window SWR sync for the initial load. The cursor is opaque — today an
        ISO-8601 server time, internally swappable for a monotonic syncVersion
        behind the same shape.
      security:
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Calendar to diff. Must belong to the authenticated user.
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            Opaque cursor — the previous response's `serverTime`, echoed
            verbatim. Omit on the first call to force full per-window SWR.
        - name: includeTodos
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: When false, timeless todos are excluded from the changed set.
      responses:
        '200':
          description: The change-delta since the cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: The calendar is owned by another user.
        '404':
          description: The calendar does not exist.

  /tasks/{id}:
    get:
      tags: [tasks]
      summary: Get a task series row
      description: |
        Returns the full `TaskDTO` for the series anchor, including the embedded
        `recurrence` rule ready for an edit form. Use this to open the detail /
        edit screen.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task id.
      responses:
        '200':
          description: Task series row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDTO'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: Task belongs to another user.
        '404':
          description: No task with that id.
    patch:
      tags: [tasks]
      summary: Update a task (all / one-off scope)
      description: |
        Updates the task's fields in the "all" scope — the whole series or the
        one-off task. Omitted fields are left unchanged. `recurrence: null` clears
        the inline config; a `RecurrenceRuleInput` replaces or adds it. `color` and
        `requiresCompletion` may likewise be set or cleared (null re-inherits the
        group). Returns the updated `TaskDTO`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: Task belongs to another user.
        '404':
          description: No task with that id.
    delete:
      tags: [tasks]
      summary: Delete a task
      description: |
        Soft-deletes the task (and its series, for recurring tasks). Returns
        `{ id }` with HTTP 200 — NOT 204, so the iOS client can decode the body.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task id.
      responses:
        '200':
          description: Task deleted.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: Task belongs to another user.
        '404':
          description: No task with that id.

  /tasks/{id}/completion:
    patch:
      tags: [tasks]
      summary: Toggle task or occurrence completion
      description: |
        When `occurrenceStart` is provided, toggles completion for that single
        occurrence of a recurring task (per-instance). When omitted, toggles the
        series anchor or one-off task. Returns a `CompletionResultDTO`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task id (series anchor or one-off).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCompletionRequest'
      responses:
        '200':
          description: Completion state updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResultDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: Task belongs to another user.
        '404':
          description: No task with that id.

  /tasks/{id}/skip:
    post:
      tags: [tasks]
      summary: Skip a single recurring occurrence
      description: |
        Marks a single occurrence as skipped by upserting a
        `TaskOccurrenceException` with `isSkipped: true`. The occurrence
        disappears from the calendar without affecting other instances or the
        series rule. Returns `{ ok: true }`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task id (series anchor).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkipOccurrenceRequest'
      responses:
        '200':
          description: Occurrence skipped.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: Task belongs to another user.
        '404':
          description: No task with that id, or occurrenceStart is not a real occurrence.

  /task-groups:
    get:
      tags: [task-groups]
      summary: List task groups
      description: |
        Returns all task groups for the authenticated user. When `calendarId` is
        provided, scopes the result to that calendar (ownership asserted); otherwise
        returns groups across all calendars the user owns. Each group includes its
        embedded `recurrence` config (or null).
      security:
        - bearerAuth: []
      parameters:
        - name: calendarId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: When given, scopes to a single calendar.
      responses:
        '200':
          description: Task groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskGroupDTO'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: The calendar is owned by another user.
        '404':
          description: The calendar does not exist.
    post:
      tags: [task-groups]
      summary: Create a task group
      description: |
        Creates a task group in the referenced calendar. When `recurrence` is
        provided, it is stored inline as the group's default `recurrenceConfig`
        (JSONB — no separate row, ADR 0054); tasks in the group with no own config
        inherit this schedule. Returns the created `TaskGroupDTO`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskGroupRequest'
      responses:
        '201':
          description: Task group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGroupDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: The calendar is owned by another user.
        '404':
          description: The calendar does not exist.

  /task-groups/reorder:
    patch:
      tags: [task-groups]
      summary: Bulk-reorder task groups
      description: |
        Transactionally reorders the caller's task groups: each group in `groupIds`
        receives a `sortOrder` equal to its index, replacing N racy single PATCHes.
        Every id must exist (else 404) and belong to a calendar the caller owns
        (else 403) — validated BEFORE any mutation, so a partial reorder can never
        persist. Returns the reordered groups in the requested order.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderTaskGroupsRequest'
      responses:
        '200':
          description: The reordered task groups, in the requested order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskGroupDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: A referenced group belongs to a calendar the caller does not own.
        '404':
          description: A referenced group id does not exist.

  /task-groups/{id}:
    patch:
      tags: [task-groups]
      summary: Update a task group
      description: |
        Updates the task group's mutable fields. `recurrence: null` clears the
        inline default config; a `RecurrenceRuleInput` replaces or adds it. `color`
        and `requiresCompletion` (the defaults tasks inherit) may likewise be set or
        cleared. Returns the updated `TaskGroupDTO`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task group id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskGroupRequest'
      responses:
        '200':
          description: Updated task group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGroupDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: Task group belongs to another user.
        '404':
          description: No task group with that id.
    delete:
      tags: [task-groups]
      summary: Delete a task group
      description: |
        Deletes the task group. Contained tasks are not deleted; their `groupId`
        is set to null. Returns `{ id }` with HTTP 200.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Task group id.
      responses:
        '200':
          description: Task group deleted.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        '401':
          description: Missing, invalid, or expired bearer token.
        '403':
          description: Task group belongs to another user.
        '404':
          description: No task group with that id.

  /users/me:
    delete:
      tags: [users]
      summary: Delete the current user account
      description: |
        Account deletion (S5). Best-effort revokes the Apple refresh token, then
        deletes the user row; DB-level FK cascades purge the whole aggregate
        (Calendars → Tasks/Groups/Strategies, Devices, TelegramLink,
        ScheduledNotifications, PersonaPrompt, UserReportSettings). Responds 200
        `{ ok: true }`.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/OkResponse'
        '401':
          description: Missing, invalid, or expired bearer token.

  /users/me/devices:
    post:
      tags: [users]
      summary: Register an APNs device token
      description: |
        Registers (upserts) an APNs device token for the authed user. Idempotent —
        re-posting a known token re-claims/refreshes the row rather than
        duplicating. Returns 201 with the `DeviceDTO`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered (or refreshed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.

  /users/me/devices/{token}:
    delete:
      tags: [users]
      summary: Unregister an APNs device token
      description: |
        Unregisters an APNs token owned by the authed user (scoped to the caller).
        Responds 200 `{ ok: true }` (JSON body, not 204, matching the repo's delete
        convention); 404 when the token is not owned by the caller.
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: The APNs device token to unregister.
      responses:
        '200':
          $ref: '#/components/responses/OkResponse'
        '401':
          description: Missing, invalid, or expired bearer token.
        '404':
          description: No such token owned by the caller.

  /users/me/daily-brief:
    get:
      tags: [users]
      summary: Get the current user morning daily brief
      description: |
        Morning daily brief (D2). Optional `date` (YYYY-MM-DD, user-local; defaults
        to today). Cache-aside: a 24h Redis cache keyed by userId+localDate bounds
        the MAIN-model cost to one generation per user per local day. `brief` is
        null when generation produced nothing usable. Optional `refresh` (default
        false): when true, the cache read is BYPASSED, the brief is regenerated,
        and the fresh value OVERWRITES the cached entry — used to force a fresh
        brief on demand (e.g. right after the user changes their brief settings).
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-06-27'
          description: Local date (YYYY-MM-DD, user timezone) to brief on; defaults to today.
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
            example: true
          description: When true, bypass the cache read, regenerate, and overwrite the cached brief.
      responses:
        '200':
          description: The daily brief for the resolved local day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyBriefDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.

  /users/me/persona-presets:
    get:
      tags: [users]
      summary: List the curated AI persona presets
      description: |
        Lists the seeded curated persona presets (D9) the iOS persona screen offers
        as pickable starting points.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The curated persona presets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonaPresetDTO'
        '401':
          description: Missing, invalid, or expired bearer token.

  /users/me/settings:
    get:
      tags: [users]
      summary: Get the current user account settings
      description: |
        Returns the signed-in user's mutable account settings — currently the
        IANA `timezone` every time-of-day-local computation resolves against
        (recurrence expansion, the daily-report scheduler).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsDTO'
        '401':
          description: Missing, invalid, or expired bearer token.
    patch:
      tags: [users]
      summary: Update the current user account settings
      description: |
        Updates the signed-in user's account settings. `timezone` is optional —
        send only what changed — but when present must be a valid IANA zone (e.g.
        `Europe/Berlin`); an unknown or malformed value is rejected with 400. This
        is the post-sign-in path; the timezone is otherwise only set at sign-in
        via `POST /auth/apple`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
      responses:
        '200':
          description: Updated account settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.

  /users/me/report-settings:
    get:
      tags: [users]
      summary: Get the current user daily-report settings
      description: |
        Returns the signed-in user's daily notification-report settings, creating
        a default (`enabled: false`, `reportTimeLocal: "08:00"`) on the first read
        so the iOS Settings screen always has a row to render. Telegram exposes no
        config — these settings are REST/iOS only. See `docs/adr/0046-assistant-daily-report-scheduler.md`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current daily-report settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSettingsDTO'
        '401':
          description: Missing, invalid, or expired bearer token.
    patch:
      tags: [users]
      summary: Update the current user daily-report settings
      description: |
        Updates `enabled` and/or `reportTimeLocal` for the signed-in user. Both
        fields are optional — send only what changed. `reportTimeLocal` must be a
        24-hour zero-padded `HH:mm`; an out-of-range or malformed value is rejected
        with 400. Creates the default row first when none exists.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportSettingsRequest'
      responses:
        '200':
          description: Updated daily-report settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSettingsDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.

  /users/me/brief-settings:
    get:
      tags: [users]
      summary: Get the current user daily-brief settings
      description: |
        Returns the signed-in user's daily-brief personalization settings, creating
        a default (`customPrompt: null`) on the first read so the iOS Settings
        screen always has a row to render. `customPrompt` is the user's own
        instruction appended to the base daily-brief prompt; null means the base
        prompt is used as-is.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current daily-brief settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefSettingsDTO'
        '401':
          description: Missing, invalid, or expired bearer token.
    patch:
      tags: [users]
      summary: Update the current user custom daily-brief prompt
      description: |
        Sets the signed-in user's custom brief prompt. `customPrompt` is required
        in the body but nullable: a non-empty string (trimmed, ≤2000 chars) sets
        it; an explicit `null` (or an empty/whitespace-only string) clears it back
        to the base prompt. The custom prompt AUGMENTS the base prompt (it never
        replaces the base structure/safety/format rules). This PATCH invalidates
        today's cached brief for the user so the new prompt takes effect on the
        next `GET /users/me/daily-brief` read.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBriefSettingsRequest'
      responses:
        '200':
          description: Updated daily-brief settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefSettingsDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
    delete:
      tags: [users]
      summary: Reset the current user daily-brief settings
      description: |
        Resets the signed-in user's brief settings to default by clearing
        `customPrompt`, and invalidates today's cached brief. Returns the now-
        cleared settings (`customPrompt: null`). Idempotent — succeeds whether or
        not a custom prompt was set.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The now-cleared daily-brief settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefSettingsDTO'
        '401':
          description: Missing, invalid, or expired bearer token.

  /users/me/persona-settings:
    get:
      tags: [users]
      summary: Get the current user AI persona
      description: |
        Returns the signed-in user's active AI persona — their own custom text
        when set, otherwise the seeded out-of-box "Jarvis" preset (a dry, formal
        English-butler persona). Always returns a usable persona so the iOS
        Settings screen has something to render. Telegram exposes no config —
        these settings are REST/iOS only. See `docs/adr/0047-assistant-per-user-persona.md`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user's active AI persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaSettingsDTO'
        '401':
          description: Missing, invalid, or expired bearer token.
    patch:
      tags: [users]
      summary: Update the current user custom AI persona
      description: |
        Sets the signed-in user's custom persona text. `promptText` is required,
        trimmed, and bounded (1–2000 characters); an empty (whitespace-only) or
        over-long value is rejected with 400. Upserts the user's persona row; the
        response reflects the persisted persona (`source: custom`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonaSettingsRequest'
      responses:
        '200':
          description: The persisted AI persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaSettingsDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Missing, invalid, or expired bearer token.
    delete:
      tags: [users]
      summary: Reset the current user custom AI persona
      description: |
        Clears the signed-in user's custom persona (D9 reset-to-preset) and returns
        the now-active persona — the seeded preset, or the code-constant default
        when no preset is set. Idempotent.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The now-active persona after the reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaSettingsDTO'
        '401':
          description: Missing, invalid, or expired bearer token.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserSettingsDTO:
      type: object
      description: |
        The signed-in user's mutable account settings. `timezone` is the IANA zone
        every time-of-day-local computation resolves against (recurrence
        expansion, the daily-report scheduler).
      required: [timezone, displayName, avatarBase64, morningBriefEnabled, eveningRecapEnabled]
      properties:
        timezone:
          type: string
          example: 'Europe/Berlin'
          description: The user's IANA timezone identifier.
        displayName:
          type: [string, 'null']
          example: 'Jane Appleseed'
          description: The user's display name; null when unset. (S6)
        avatarBase64:
          type: [string, 'null']
          description: The user's avatar as a base64 string; null when unset. (S6)
        morningBriefEnabled:
          type: boolean
          description: Whether the morning daily-brief notification is opted in. (D8)
        eveningRecapEnabled:
          type: boolean
          description: Whether the evening recap notification is opted in. (D8)
    UpdateUserSettingsRequest:
      type: object
      description: |
        Partial update for the account settings. Send only the fields that
        changed; an omitted field is left untouched (the service mutates only
        changed fields and short-circuits a no-op). `timezone`, when present,
        must be a valid IANA zone; an unknown or malformed value is rejected
        with 400.
      properties:
        timezone:
          type: string
          maxLength: 64
          example: 'Europe/Berlin'
          description: IANA timezone identifier for the signed-in user.
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          example: 'Jane Appleseed'
          description: |
            Display name (trimmed; 1–200 chars). null clears it. A whitespace-only
            value (trims to empty) or an over-long value is rejected with 400. (S6)
        avatarBase64:
          type: [string, 'null']
          description: |
            Avatar image as a base64 string (base64- and size-validated); null
            clears it; a malformed or over-size value is rejected with 400. (S6)
        morningBriefEnabled:
          type: boolean
          description: Opt in/out of the morning daily-brief notification. (D8)
        eveningRecapEnabled:
          type: boolean
          description: Opt in/out of the evening recap notification. (D8)
    ReportSettingsDTO:
      type: object
      description: |
        The signed-in user's daily notification-report settings. `reportTimeLocal`
        is a wall-clock send time interpreted in the user's timezone (User.timezone).
        The internal last-sent-date idempotency guard is not exposed.
      required: [enabled, reportTimeLocal, channel]
      properties:
        enabled:
          type: boolean
          description: Whether the daily report is switched on.
        reportTimeLocal:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '08:00'
          description: Local wall-clock send time as HH:mm (24-hour, zero-padded).
        channel:
          type: string
          enum: [PUSH, TELEGRAM]
          description: |
            Preferred delivery channel (S7). PUSH persists but only Telegram
            delivers today — push delivery is deferred to D1.
    UpdateReportSettingsRequest:
      type: object
      description: |
        Partial update for the daily-report settings. Send only the fields that
        changed; an omitted field is left untouched.
      properties:
        enabled:
          type: boolean
          description: Switch the daily report on or off.
        reportTimeLocal:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '08:00'
          description: Local wall-clock send time as HH:mm (24-hour, zero-padded).
        channel:
          type: string
          enum: [PUSH, TELEGRAM]
          description: |
            Preferred delivery channel (S7). PUSH persists but only Telegram
            delivers today — push delivery is deferred to D1.
    BriefSettingsDTO:
      type: object
      description: |
        The signed-in user's daily-brief personalization settings. `customPrompt`
        is the user's own instruction appended to the base daily-brief prompt, or
        null when unset (the base prompt is used as-is).
      required: [customPrompt]
      properties:
        customPrompt:
          type: [string, 'null']
          example: 'Keep it very brief and mention the weather if relevant.'
          description: |
            The user's custom instruction appended to the base daily-brief prompt,
            or null when unset.
    UpdateBriefSettingsRequest:
      type: object
      description: |
        Sets the user's custom brief prompt. `customPrompt` is required in the body
        but nullable: a non-empty string (trimmed, ≤2000 chars) sets it; null (or
        an empty/whitespace-only string, normalized to null) clears it back to the
        base prompt.
      required: [customPrompt]
      properties:
        customPrompt:
          type: [string, 'null']
          maxLength: 2000
          example: 'Keep it very brief and mention the weather if relevant.'
          description: |
            The custom instruction appended to the base daily-brief prompt. A non-
            empty string sets it; null (or an empty string) clears it.
    PersonaSettingsDTO:
      type: object
      description: |
        The signed-in user's active AI persona. `promptText` is the persona text
        the assistant adopts (the user's own when set, else the seeded preset);
        `source` distinguishes a curated preset from the user's own custom text;
        `presetName` is the preset's display name when `source` is `preset`,
        otherwise null.
      required: [promptText, source, presetName]
      properties:
        promptText:
          type: string
          description: The active persona instruction text the assistant adopts.
        source:
          type: string
          enum: [preset, custom]
          description: Whether the active persona is a curated preset or custom text.
        presetName:
          type: ['string', 'null']
          example: 'Jarvis'
          description: Preset display name when source is `preset`, else null.
    UpdatePersonaSettingsRequest:
      type: object
      description: |
        Sets the user's custom persona text. `promptText` is required, trimmed,
        and bounded (1–2000 characters); an empty or over-long value is rejected
        with 400.
      required: [promptText]
      properties:
        promptText:
          type: string
          minLength: 1
          maxLength: 2000
          description: The custom persona instruction text for the assistant.
    RecurrenceConfig:
      type: object
      description: |
        The inline recurrence config returned inside TaskDTO and TaskGroupDTO.
        Stored as a JSONB column on `task` / `task_group` (no separate row, no
        `id`) — ADR 0054. Field names are normative — the FE decodes them exactly.
      required: [frequency, interval, byWeekday, byMonthDay, byMonth, bySetPos, monthlyAnchor, endType, endDate, count]
      properties:
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
        interval:
          type: integer
          minimum: 1
          description: Repeat every N units. 1 = every period.
        byWeekday:
          type: ['array', 'null']
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: Weekday ordinals (0 = Mon … 6 = Sun). Null means no restriction.
        byMonthDay:
          type: ['array', 'null']
          items:
            type: integer
            minimum: 1
            maximum: 31
          description: Days of the month. Null means no restriction.
        byMonth:
          type: ['array', 'null']
          items:
            type: integer
            minimum: 1
            maximum: 12
          description: Months (1–12). Null means no restriction.
        bySetPos:
          type: ['array', 'null']
          items:
            type: integer
            enum: [1, 2, 3, 4, -1]
          description: |
            MONTHLY ordinal selectors paired with `byWeekday` — e.g. `[1]` + Monday =
            "first Monday", `[-1]` + Friday = "last Friday". 1..4 or -1. Null means
            no nth-weekday restriction.
        monthlyAnchor:
          type: ['string', 'null']
          enum: [FIRST_WORKDAY, LAST_WORKDAY, DAY_BEFORE_LAST_WORKDAY, null]
          description: |
            MONTHLY working-day anchor — resolves to the first / last / day-before-last
            workday of each month. Mutually exclusive with the `bySetPos`/`byMonthDay`
            axes. Null when no working-day anchor applies.
        endType:
          type: string
          enum: [NEVER, UNTIL_DATE, COUNT]
        endDate:
          type: [string, 'null']
          format: date
          description: Required when endType = UNTIL_DATE.
        count:
          type: [integer, 'null']
          minimum: 1
          description: Required when endType = COUNT.

    RecurrenceRuleInput:
      type: object
      description: |
        Recurrence config payload sent inside create/update task and task-group
        request bodies — the same inline shape as RecurrenceConfig (normalized and
        stored verbatim as JSONB). Cross-field: COUNT requires `count`; UNTIL_DATE
        requires `endDate`.
      required: [frequency]
      properties:
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
        interval:
          type: integer
          minimum: 1
          default: 1
        byWeekday:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        byMonthDay:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 31
        byMonth:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 12
        bySetPos:
          type: array
          items:
            type: integer
            enum: [1, 2, 3, 4, -1]
          description: |
            MONTHLY ordinal selectors paired with `byWeekday` ("first Monday",
            "last Friday"). Values 1..4 or -1.
        monthlyAnchor:
          type: string
          enum: [FIRST_WORKDAY, LAST_WORKDAY, DAY_BEFORE_LAST_WORKDAY]
          description: |
            MONTHLY working-day anchor (first / last / day-before-last workday).
            Mutually exclusive with the `bySetPos`/`byMonthDay` axes.
        endType:
          type: string
          enum: [NEVER, UNTIL_DATE, COUNT]
          default: NEVER
        endDate:
          type: string
          format: date
          description: Required when endType = UNTIL_DATE.
        count:
          type: integer
          minimum: 1
          description: Required when endType = COUNT.

    TaskDTO:
      type: object
      description: |
        A task series row. Returned by POST /tasks, PATCH /tasks/:id, GET /tasks/:id.
        Includes the embedded recurrence config for the edit form.
      required:
        [id, calendarId, groupId, title, notes, startAt, endAt, isAllDay, timezone,
         requiresCompletion, color, icon, reminders, completedAt, recurrence,
         notificationStrategyId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        calendarId:
          type: string
          format: uuid
        groupId:
          type: [string, 'null']
          format: uuid
        title:
          type: string
        notes:
          type: [string, 'null']
        icon:
          type: [string, 'null']
          description: Per-task icon (e.g. an SF Symbol name); null when iconless. (S4)
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/ReminderResultDTO'
          description: |
            The task's own per-task reminders (offset + channel), earliest first.
            Empty when the task carries no per-task reminders. (S1)
        startAt:
          type: [string, 'null']
          format: date-time
          description: ISO-8601 start; null for a timeless todo.
        endAt:
          type: [string, 'null']
          format: date-time
        isAllDay:
          type: boolean
        timezone:
          type: string
          description: IANA zone — the anchor for recurrence/DST expansion.
        requiresCompletion:
          type: [boolean, 'null']
          description: |
            Per-task override; null inherits the group, then defaults to false.
            See the effective-settings resolver (ADR 0054, task-wins).
        color:
          type: [string, 'null']
          description: |
            A TaskColor preset name OR a #RRGGBB hex; null inherits the group.
            Effective color resolves task-wins (ADR 0054).
        completedAt:
          type: [string, 'null']
          format: date-time
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceConfig'
            - type: 'null'
          description: |
            Inline recurrence config (JSONB) for the edit form; null when not
            recurring. ADR 0054 — no separate rule id.
        notificationStrategyId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OccurrenceDTO:
      type: object
      description: |
        A single expanded occurrence. Returned by GET /tasks. One per visible
        calendar cell. Stable identity = (taskId, occurrenceStart).
      required:
        [taskId, calendarId, groupId, groupColorHex, originalStart, occurrenceStart, occurrenceEnd,
         title, notes, isAllDay, timezone, requiresCompletion, color, icon, completedAt,
         isRecurring, isException]
      properties:
        taskId:
          type: string
          format: uuid
          description: Series anchor id — same across all occurrences of a recurring task.
        calendarId:
          type: string
          format: uuid
        groupId:
          type: [string, 'null']
          format: uuid
        groupColorHex:
          type: [string, 'null']
          example: '#E27921'
          description: The owning group's color (preset name or #RRGGBB); null when ungrouped.
        originalStart:
          type: [string, 'null']
          format: date-time
          description: Rule-generated start BEFORE any override; stable instance key WITH taskId.
        occurrenceStart:
          type: [string, 'null']
          format: date-time
          description: Effective start with any overrideStartAt applied.
        occurrenceEnd:
          type: [string, 'null']
          format: date-time
        title:
          type: string
        notes:
          type: [string, 'null']
        isAllDay:
          type: boolean
        timezone:
          type: string
        requiresCompletion:
          type: boolean
          description: |
            Effective value (task ?? group ?? false) per the ADR 0054 resolver,
            already resolved for the rendered occurrence.
        color:
          type: [string, 'null']
          description: |
            Effective color (task ?? group) per the ADR 0054 resolver — a TaskColor
            preset name OR a #RRGGBB hex; null when neither task nor group sets one.
        icon:
          type: [string, 'null']
          description: Per-task icon (e.g. an SF Symbol name); null when iconless. (S4)
        completedAt:
          type: [string, 'null']
          format: date-time
          description: Per-instance completion for recurring tasks.
        isRecurring:
          type: boolean
        isException:
          type: boolean

    DailyCountsDTO:
      type: object
      description: |
        Per-day occurrence counts. Returned by GET /tasks/daily-counts. The
        `counts` map is keyed by local date (YYYY-MM-DD, in each task's
        timezone); zero-count days are omitted.
      required: [counts]
      properties:
        counts:
          type: object
          additionalProperties:
            type: integer
          description: Occurrence count per local date (YYYY-MM-DD).
          example:
            '2026-06-20': 3
            '2026-06-21': 1
            '2026-06-23': 2

    TaskOccurrenceExceptionDTO:
      type: object
      description: |
        A per-occurrence override (skip / reschedule / rename / completion) on a
        recurring task. Carried by GET /tasks/changes. Instance identity =
        (taskId, originalStartAt).
      required:
        [id, taskId, originalStartAt, isSkipped, overrideStartAt, overrideEndAt,
         overrideTitle, completedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
          description: Parent series anchor id.
        originalStartAt:
          type: string
          format: date-time
          description: Rule-generated start this override applies to (instance key).
        isSkipped:
          type: boolean
        overrideStartAt:
          type: [string, 'null']
          format: date-time
        overrideEndAt:
          type: [string, 'null']
          format: date-time
        overrideTitle:
          type: [string, 'null']
        completedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChangesDTO:
      type: object
      description: |
        The precise change-delta for a calendar. Returned by GET /tasks/changes.
        Apply order on the client: drop `deleted` series, re-pull windows
        overlapping each changed series, invalidate the window of each changed
        exception's originalStartAt, then store `serverTime` as the next cursor.
      required: [tasks, deleted, exceptions, serverTime]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskDTO'
          description: Changed series rows (updatedAt > since), recurrence embedded.
        deleted:
          type: array
          items:
            type: string
            format: uuid
          description: Series ids soft-deleted since the cursor (deletedAt > since).
          example: ['task-old-1', 'task-old-2']
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/TaskOccurrenceExceptionDTO'
          description: Per-occurrence overrides changed since the cursor.
        serverTime:
          type: string
          format: date-time
          description: New opaque cursor (server clock); echo as `since` next time.
          example: '2026-06-20T14:35:22.145Z'

    TaskGroupDTO:
      type: object
      description: |
        A task group. Returned by all task-group endpoints.
        The embedded `recurrence` is the group default config inherited by tasks
        with no own recurrence; `color` / `requiresCompletion` are likewise the
        group-level defaults a task inherits when it sets none (ADR 0054).
      required:
        [id, calendarId, name, color, requiresCompletion, icon, sortOrder,
         recurrence, defaultNotificationStrategyId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        calendarId:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: [string, 'null']
          description: |
            Group default color — a TaskColor preset name OR a #RRGGBB hex; tasks
            inherit it when they set no own color (ADR 0054).
        requiresCompletion:
          type: [boolean, 'null']
          description: |
            Group default completion requirement; tasks inherit it when they set
            none, falling back to false (ADR 0054 resolver). Nullable, no DB default.
        icon:
          type: [string, 'null']
        sortOrder:
          type: integer
          minimum: 0
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceConfig'
            - type: 'null'
          description: |
            Inline group default recurrence config (JSONB); null when the group has
            no default. ADR 0054 — no separate rule id.
        defaultNotificationStrategyId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CompletionResultDTO:
      type: object
      required: [taskId, occurrenceStart, completedAt]
      description: Returned by PATCH /tasks/:id/completion.
      properties:
        taskId:
          type: string
          format: uuid
        occurrenceStart:
          type: [string, 'null']
          format: date-time
          description: The occurrence that was toggled; null for series/one-off completion.
        completedAt:
          type: [string, 'null']
          format: date-time
          description: New completion timestamp; null when marked not complete.

    CreateTaskRequest:
      type: object
      required: [calendarId, title, timezone]
      properties:
        calendarId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        notes:
          type: [string, 'null']
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        isAllDay:
          type: boolean
          default: false
        timezone:
          type: string
          description: IANA zone.
        requiresCompletion:
          type: [boolean, 'null']
          description: |
            Omit / null to inherit the group, falling back to false (ADR 0054
            resolver). No column default.
        color:
          type: [string, 'null']
          description: A TaskColor preset name OR a #RRGGBB hex; null/omit inherits the group.
        icon:
          type: [string, 'null']
          description: Optional per-task icon (e.g. an SF Symbol name). (S4)
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/ReminderRequest'
          description: Per-task reminders (offset + channel) created with the task. (S1)
        groupId:
          type: string
          format: uuid
          description: Optional group (must live in the same calendar).
        recurrence:
          $ref: '#/components/schemas/RecurrenceRuleInput'

    UpdateTaskRequest:
      type: object
      description: All fields optional — omitted keys leave the current value unchanged.
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: [string, 'null']
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        isAllDay:
          type: boolean
        requiresCompletion:
          type: [boolean, 'null']
          description: null clears the per-task override (re-inherit group, then false). ADR 0054.
        color:
          type: [string, 'null']
          description: |
            A TaskColor preset name OR a #RRGGBB hex; null clears the per-task color
            (re-inherit group). ADR 0054.
        icon:
          type: [string, 'null']
          description: Per-task icon (e.g. an SF Symbol name); null clears it. (S4)
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/ReminderRequest'
          description: |
            When provided, REPLACES the full per-task reminder set; an empty array
            clears all reminders; omitting the key leaves the existing set intact. (S1)
        groupId:
          type: [string, 'null']
          format: uuid
          description: Set to null to ungroup.
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRuleInput'
            - type: 'null'
          description: null removes the inline config; an Input replaces/adds it.

    SetCompletionRequest:
      type: object
      required: [isCompleted]
      properties:
        isCompleted:
          type: boolean
          description: True sets completedAt = now (idempotent); false clears it.
        occurrenceStart:
          type: string
          format: date-time
          description: |
            ISO-8601 occurrence to toggle. When provided, only that instance is
            toggled. When omitted, the series anchor or one-off is toggled.

    SkipOccurrenceRequest:
      type: object
      required: [occurrenceStart]
      properties:
        occurrenceStart:
          type: string
          format: date-time
          description: ISO-8601 occurrence to skip.

    CreateTaskGroupRequest:
      type: object
      required: [calendarId, name]
      properties:
        calendarId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        color:
          type: string
          description: Group default color — a TaskColor preset name OR a #RRGGBB hex.
        requiresCompletion:
          type: [boolean, 'null']
          description: Group default completion requirement inherited by tasks (ADR 0054). No column default.
        icon:
          type: string
        sortOrder:
          type: integer
          minimum: 0
          default: 0
        defaultNotificationStrategyId:
          type: string
          format: uuid
        recurrence:
          $ref: '#/components/schemas/RecurrenceRuleInput'

    UpdateTaskGroupRequest:
      type: object
      description: All fields optional — omitted keys leave the current value unchanged.
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: [string, 'null']
          description: |
            Group default color — a TaskColor preset name OR a #RRGGBB hex; null
            clears it. (Also settable by the assistant via the `update_group` AI tool — ADR 0054.)
        requiresCompletion:
          type: [boolean, 'null']
          description: Group default completion requirement; null clears it. ADR 0054.
        icon:
          type: [string, 'null']
        sortOrder:
          type: integer
          minimum: 0
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/RecurrenceRuleInput'
            - type: 'null'
          description: null removes the group default config; an Input replaces/adds it.

    AppleSignInRequest:
      type: object
      required: [identityToken]
      properties:
        identityToken:
          type: string
          minLength: 1
          description: |
            JWT returned by `ASAuthorizationAppleIDCredential.identityToken` on
            the iOS client.
        fullName:
          type: string
          maxLength: 200
          description: |
            Display name. Apple surfaces this only on the very first sign-in;
            clients may resend on subsequent calls for completeness.
        avatarBase64:
          type: string
          maxLength: 5000000
          description: |
            Base64-encoded profile picture (no data-URL prefix). Sourced from
            the iOS "me" Contacts entry. ~5MB cap.
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone. Falls back to `UTC` on the server if omitted.

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: |
            HS256-signed JWT. Payload is `{ sub: <Cue user uuid> }`.
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, appleUserId, timezone, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        appleUserId:
          type: string
          description: Apple's `sub` claim — stable, opaque, per-app.
        email:
          type: [string, 'null']
          format: email
        displayName:
          type: [string, 'null']
        avatarBase64:
          type: [string, 'null']
        timezone:
          type: string
          default: UTC
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LinkTelegramRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: |
            Single-use linking nonce the bot issued in the "Connect Telegram"
            prompt. The iOS app receives it via the universal link (or manual
            paste) and redeems it over the authenticated session.

    TelegramLinkStatus:
      type: object
      required: [linked, telegramUsername, linkedAt]
      description: |
        Telegram link state returned by `GET`, `POST`, and `DELETE
        /assistant/link`. When not linked, `telegramUsername` and `linkedAt` are
        null.
      properties:
        linked:
          type: boolean
        telegramUsername:
          type: [string, 'null']
          description: Telegram @handle, when known (may be null even when linked).
        linkedAt:
          type: [string, 'null']
          format: date-time
          description: ISO-8601 timestamp the link was established, or null when unlinked.

    OkResponse:
      type: object
      required: [ok]
      description: |
        Bare success acknowledgement `{ ok: true }` for endpoints that affect a
        resource without returning it (matches the repo's delete convention).
      properties:
        ok:
          type: boolean
          enum: [true]

    ReminderRequest:
      type: object
      description: A single per-task reminder on a create/update task payload (S1).
      required: [offsetMinutes, channel]
      properties:
        offsetMinutes:
          type: integer
          minimum: -10080
          maximum: 10080
          example: -15
          description: |
            Offset in minutes from the task start (negative fires before, positive
            after), bounded to ±1 week.
        channel:
          type: string
          enum: [PUSH, TELEGRAM]
          description: Delivery channel for this reminder.

    ReminderResultDTO:
      type: object
      description: |
        A per-task reminder returned on TaskDTO (S1). Carries the persisted rule id
        so the client can correlate, plus the offset + channel.
      required: [id, offsetMinutes, channel]
      properties:
        id:
          type: string
          format: uuid
        offsetMinutes:
          type: integer
          example: -15
        channel:
          type: string
          enum: [PUSH, TELEGRAM]

    TaskSearchResultDTO:
      type: object
      description: |
        A single task search hit (M1). Carries the matched series row's identity,
        its owning group's id + color, and its anchor date/time — for a recurring
        series, the anchor occurrence (the calendar view expands occurrences
        separately).
      required:
        [taskId, calendarId, groupId, groupColorHex, title, notes, startAt, endAt,
         isAllDay, timezone, isRecurring]
      properties:
        taskId:
          type: string
          format: uuid
        calendarId:
          type: string
          format: uuid
        groupId:
          type: [string, 'null']
          format: uuid
        groupColorHex:
          type: [string, 'null']
          example: '#E27921'
          description: The owning group's color (preset name or #RRGGBB); null when ungrouped.
        title:
          type: string
        notes:
          type: [string, 'null']
        startAt:
          type: [string, 'null']
          format: date-time
        endAt:
          type: [string, 'null']
          format: date-time
        isAllDay:
          type: boolean
        timezone:
          type: string
        isRecurring:
          type: boolean
          description: True when the matched task is a recurring series (startAt is its anchor).

    ReorderTaskGroupsRequest:
      type: object
      description: |
        Bulk-reorder payload (the complete, ordered list of group ids). Each group
        receives a `sortOrder` equal to its index, transactionally. Every id must
        exist (else 404) and belong to a calendar the caller owns (else 403).
      required: [groupIds]
      properties:
        groupIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Ordered group ids; each row receives a sortOrder equal to its index.

    DevicePlatform:
      type: string
      enum: [ios, ipados, macos]
      description: The platform an APNs device token was issued on.

    RegisterDeviceRequest:
      type: object
      description: |
        Registers (upserts) an APNs device token for the current user. Idempotent —
        a re-posted known token re-claims/refreshes the row rather than duplicating.
      required: [token, platform]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: The opaque APNs device token issued to the client.
        platform:
          $ref: '#/components/schemas/DevicePlatform'

    DeviceDTO:
      type: object
      description: A registered device. Returned by POST /users/me/devices. Omits the owning userId.
      required: [id, token, platform, lastSeenAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: The opaque APNs device token.
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DailyBriefDTO:
      type: object
      description: |
        Morning daily brief (D2). `brief` is the generated text, or null when the
        model produced nothing usable for the day (client shows an empty state).
        `localDate` is the resolved local day the brief covers.
      required: [brief, localDate]
      properties:
        brief:
          type: [string, 'null']
          example: 'Good morning. You have a 10:00 dentist and a 14:00 sync.'
        localDate:
          type: string
          example: '2026-06-27'
          description: The local date (YYYY-MM-DD, user timezone) the brief covers.

    ParseTaskRequest:
      type: object
      description: |
        One line of natural language to parse into a structured task draft (D4),
        WITHOUT creating a task. Bounded so a stray paste cannot drive an unbounded
        model call.
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          example: 'gym every monday and wednesday at 7am'

    TaskDraftDTO:
      type: object
      description: |
        The structured task draft the assistant extracted from one line of natural
        language (D4). DRAFT only — no task is created; the iOS quick-create well
        pre-fills from this and the user confirms/edits before a real POST /tasks.
      required: [title]
      properties:
        title:
          type: string
          example: 'gym'
          description: Extracted task title, with scheduling words stripped.
        start:
          type: string
          format: date-time
          description: ISO-8601 start resolved in the user timezone; omitted for a timeless todo.
        durationMinutes:
          type: integer
          minimum: 1
          example: 60
          description: Present only when the text implied a length.
        recurrence:
          $ref: '#/components/schemas/RecurrenceRuleInput'
        groupId:
          type: string
          format: uuid
          description: Id of an EXISTING group the draft was matched to; omitted when none applied.

    PersonaPresetDTO:
      type: object
      description: |
        One curated persona preset (D9) the iOS persona screen offers as a pickable
        starting point.
      required: [id, presetName, promptText]
      properties:
        id:
          type: string
          format: uuid
        presetName:
          type: string
          example: 'Jarvis'
        promptText:
          type: string
          description: The full persona instruction text.

    InvalidLinkCodeBody:
      type: object
      description: |
        Typed 422 body returned by POST /assistant/link on an invalid, expired, or
        already-burned nonce (M3) so iOS branches a persistent bad-code state vs a
        transient error.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_LINK_CODE]
        message:
          type: string
          example: 'This linking code is invalid, expired, or already used.'
        statusCode:
          type: integer
          example: 422

    ValidationErrorBody:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          example: Bad Request

  responses:
    ValidationError:
      description: Request DTO failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
    OkResponse:
      description: 'Success acknowledgement `{ ok: true }`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OkResponse'
