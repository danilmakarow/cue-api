# Reusable QUALITY gate (pipeline stage 1): install, lint, type-check.
# Defined once and called by ci.yml (PRs) and deploy.yml (master), so the checks can
# never drift between "check before merge" and "check before deploy". The heavier
# unit + e2e tests live in the next stage (_functionality.yml), which the callers
# run only after this gate passes.
name: quality

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm must be set up before setup-node so its cache can find the store.
      - uses: pnpm/action-setup@v5
        with:
          version: 11.3.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, incl. Prettier)
        run: pnpm lint

      - name: Type-check
        run: pnpm type
