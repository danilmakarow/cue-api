# Continuous delivery. On every push to master: re-run the quality gate, build & push the
# image to ECR (tagged with the commit SHA), then run deploy/deploy.sh on the box via SSM
# Run Command. Auth to AWS is keyless (GitHub OIDC → the cue-api-deploy role); no static keys.
#
# One-time setup (after `terraform apply` of Phase 5):
#   - Repo variable AWS_DEPLOY_ROLE_ARN = the role ARN itself (run `terraform output -raw
#     deploy_role_arn` and paste its OUTPUT, e.g. arn:aws:iam::<acct>:role/cue-api-deploy —
#     not the command text)
#   - (optional) Settings → Environments → production → required reviewers, to gate releases
name: deploy

on:
  push:
    branches: [master]

# Never run two production deploys at once; let an in-flight deploy finish (don't cancel it).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same checks as PR CI — a release can never skip the gate.
  quality:
    uses: ./.github/workflows/_quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: production # optional required-reviewer gate; also pins the OIDC subject
    permissions:
      contents: read
      id-token: write # required to request the OIDC token
    env:
      AWS_REGION: eu-north-1
      ECR_REPO: cue-api
      INSTANCE_TAG: cue-api # EC2 Name tag the deploy targets
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "Pushed ${IMAGE}"

      - name: Deploy via SSM Run Command
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Resolve the running cue-api instance by its Name tag (survives instance replacement).
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_TAG}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "None" ]; then
            echo "::error::No running EC2 instance tagged Name=${INSTANCE_TAG}"; exit 1
          fi
          echo "Target instance: ${INSTANCE_ID}"

          # Dispatch deploy.sh on the box. SSM Run Command executes as root, working dir /.
          CMD_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_TAG}" \
            --parameters commands="[\"AWS_REGION=${AWS_REGION} ECR_REGISTRY=${ECR_REGISTRY} ECR_REPO=${ECR_REPO} /opt/cue/deploy.sh ${IMAGE_TAG}\"]" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: ${CMD_ID}"

          # Poll for a terminal status (own loop, not `ssm wait`, so a slow image pull + health
          # wait can't trip the waiter's fixed attempt cap). ~10 min ceiling.
          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)"
            case "${STATUS}" in
              Success | Failed | Cancelled | TimedOut) break ;;
            esac
            sleep 10
          done

          echo "----- deploy stdout -----"
          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
            --query 'StandardOutputContent' --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "----- deploy stderr -----"
            aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query 'StandardErrorContent' --output text || true
            echo "::error::Deploy failed (SSM status: ${STATUS})"
            exit 1
          fi
          echo "Deploy succeeded (${IMAGE_TAG})"
