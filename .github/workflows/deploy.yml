# Continuous delivery. On every push to master: re-run the quality gate, build & push the
# image to ECR (tagged with the commit SHA — reused, not re-pushed, if it already exists since
# tags are immutable), then run deploy/deploy.sh on the box via SSM Run Command. Can also be
# dispatched manually to redeploy/roll back to any retained tag (see workflow_dispatch below).
# Auth to AWS is keyless (GitHub OIDC → the cue-api-deploy role); no static keys.
#
# One-time setup (after `terraform apply` of Phase 5):
#   - Repo variable AWS_DEPLOY_ROLE_ARN = the role ARN itself (run `terraform output -raw
#     deploy_role_arn` and paste its OUTPUT, e.g. arn:aws:iam::<acct>:role/cue-api-deploy —
#     not the command text)
#   - (optional) Settings → Environments → production → required reviewers, to gate releases
name: deploy

on:
  push:
    branches: [master]
  # Manually redeploy/roll back to any image still in ECR. Leave image_tag blank to build the
  # dispatched commit; set it to an existing SHA to skip the build and just (re)deploy that image.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing ECR image tag (commit SHA) to redeploy. Blank = build the dispatched commit."
        required: false
        type: string

# Never run two production deploys at once; let an in-flight deploy finish (don't cancel it).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same checks as PR CI — a release can never skip the gate.
  quality:
    uses: ./.github/workflows/_quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: production # optional required-reviewer gate; also pins the OIDC subject
    permissions:
      contents: read
      id-token: write # required to request the OIDC token
    env:
      AWS_REGION: eu-north-1
      ECR_REPO: cue-api
      INSTANCE_TAG: cue-api # EC2 Name tag the deploy targets
    steps:
      - uses: actions/checkout@v4

      # Target tag = the manual input if given, else this commit's SHA. Passed via env (not inline
      # interpolation) so a dispatch input can't inject into the shell.
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$SHA}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target image tag: ${TAG}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (reuse if the tag already exists)
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"
          # ECR tags are immutable, so re-running a deploy (or redeploying an older commit) must not
          # re-push an existing tag. Reuse the image if it's already in ECR; otherwise build & push.
          # batch-get-image uses the role's existing ecr:BatchGetImage grant (no extra IAM needed).
          EXISTING="$(aws ecr batch-get-image --repository-name "${ECR_REPO}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'images[0].imageId.imageTag' --output text 2>/dev/null || echo None)"
          if [ "${EXISTING}" = "${IMAGE_TAG}" ]; then
            echo "Image ${IMAGE} already in ECR — reusing it (no rebuild)."
          else
            docker build -t "${IMAGE}" .
            docker push "${IMAGE}"
            echo "Pushed ${IMAGE}"
          fi

      - name: Deploy via SSM Run Command
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          set -euo pipefail

          # Resolve the running cue-api instance by its Name tag (survives instance replacement).
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_TAG}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "None" ]; then
            echo "::error::No running EC2 instance tagged Name=${INSTANCE_TAG}"; exit 1
          fi
          echo "Target instance: ${INSTANCE_ID}"

          # Dispatch deploy.sh on the box. SSM Run Command executes as root, working dir /.
          CMD_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_TAG}" \
            --parameters commands="[\"AWS_REGION=${AWS_REGION} ECR_REGISTRY=${ECR_REGISTRY} ECR_REPO=${ECR_REPO} /opt/cue/deploy.sh ${IMAGE_TAG}\"]" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: ${CMD_ID}"

          # Poll for a terminal status (own loop, not `ssm wait`, so a slow image pull + health
          # wait can't trip the waiter's fixed attempt cap). ~10 min ceiling.
          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)"
            case "${STATUS}" in
              Success | Failed | Cancelled | TimedOut) break ;;
            esac
            sleep 10
          done

          echo "----- deploy stdout -----"
          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
            --query 'StandardOutputContent' --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "----- deploy stderr -----"
            aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query 'StandardErrorContent' --output text || true
            echo "::error::Deploy failed (SSM status: ${STATUS})"
            exit 1
          fi
          echo "Deploy succeeded (${IMAGE_TAG})"
