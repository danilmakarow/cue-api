# Continuous integration — runs the full check pipeline on every pull request:
# stage 1 (quality: lint + type) then stage 2 (functionality: unit + e2e). Pushes
# to master are handled by deploy.yml, which runs these same two stages before
# deploying, so the checks gate both merge and release.
name: ci

on:
  pull_request:
  # To also run on direct pushes to feature branches (no PR yet), add:
  #   push:
  #     branches-ignore: [master]

# Keep one in-flight run per branch; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1 — quality gate (lint + type-check).
  quality:
    uses: ./.github/workflows/_quality.yml

  # Stage 2 — functionality gate (unit + e2e), only after quality passes.
  functionality:
    needs: quality
    uses: ./.github/workflows/_functionality.yml
